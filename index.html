<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>Cuestionario desde Excel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
  <!-- React 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel para JSX en el navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- SheetJS para leer Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- canvas-confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>
  <div id="root">Cargando...</div>

  <script>
    (function () {
      var missing = [];
      if (typeof React === "undefined") missing.push("React");
      if (typeof ReactDOM === "undefined") missing.push("ReactDOM");
      if (typeof XLSX === "undefined") missing.push("SheetJS (XLSX)");
      if (typeof confetti === "undefined") missing.push("canvas-confetti");
      if (typeof Babel === "undefined") missing.push("Babel");

      if (missing.length) {
        var root = document.getElementById("root");
        root.innerHTML =
          '<div style="font-family: system-ui, Segoe UI, sans-serif; padding: 16px; max-width: 720px; margin: 24px auto; border: 1px solid rgba(0,0,0,.15); border-radius: 12px;">' +
          "<h2 style=\"margin:0 0 8px;\">No se pudieron cargar librerías</h2>" +
          "<p style=\"margin:0 0 8px;\">Faltan: <b>" +
          missing.join(", ") +
          "</b></p>" +
          "<p style=\"margin:0;\">Asegúrate de tener internet y vuelve a abrir <code>index.html</code>. Si prefieres, puedes ejecutar un servidor local (por ejemplo, Live Server) y abrir la app desde <code>http://localhost</code>.</p>" +
          "</div>";
      }
    })();
  </script>

  <script type="text/babel" data-presets="env,react">
    if (!window.React || !window.ReactDOM || !window.XLSX) {
      // Si faltan librerías, dejamos el mensaje de diagnóstico.
    } else {
      const { useState, useEffect, useMemo, useRef, useCallback } = React;

      function shuffleArray(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function Clock({ lightMode }) {
        const [time, setTime] = useState(new Date());

        useEffect(() => {
          const timer = setInterval(() => setTime(new Date()), 1000);
          return () => clearInterval(timer);
        }, []);

        const minutes = time.getMinutes();
        const seconds = time.getSeconds();
        const hours = time.getHours();
        const isPM = hours >= 12;

        // Calculate progress smoothly over a 24 hour period
        // 24 hours * 60 minutes * 60 seconds
        const totalSecondsInDay = 24 * 60 * 60;
        const currentSeconds = (hours * 60 * 60) + (minutes * 60) + seconds;
        const progress = currentSeconds / totalSecondsInDay;

        // SVG Circle math
        const radius = 120;
        const circumference = 2 * Math.PI * radius;
        const strokeDashoffset = circumference - progress * circumference;

        // Water fill math (0 to 60 minutes)
        const minuteProgress = minutes / 60;
        
        // El círculo empieza visualmente más arriba (por el radio y el clipPath)
        // Mapeamos el progreso para que en 0 min esté en y=260 (apenas visible) 
        // y en 60 min esté en y=20 (lleno completamente)
        const waterY = 260 - (240 * minuteProgress);

        // Formato 12 horas: medianoche es 0, mediodía es 12
        const displayHours = hours === 12 ? 12 : hours % 12;
        const displayMinutes = minutes < 10 ? '0' + minutes : minutes;
        const displayTime = `${displayHours}:${displayMinutes}`;

        return (
          <div className="clock-container">
            <svg className="clock-svg" width="280" height="280" viewBox="0 0 280 280" key="m3-stable-clock">
              <defs>
                <clipPath id="circleMask">
                  <circle cx="140" cy="140" r={radius - 6} />
                </clipPath>
              </defs>
              {/* Background circle */}
              <circle
                className={`clock-circle-bg ${lightMode >= 2 ? 'aurora-circle-bg-vibrant' : ''}`}
                cx="140"
                cy="140"
                r={radius}
                strokeWidth="12"
                fill="none"
                style={{ opacity: lightMode >= 2 ? 0.6 : 1, transition: 'none', stroke: lightMode >= 2 ? 'rgba(255,255,255,0.4)' : '#1f2937' }}
              />
              {/* Water fill group */}
              <g clipPath="url(#circleMask)">
                <g
                  style={{
                    transform: `translateY(${waterY}px)`,
                    transition: 'transform 1s ease-in-out'
                  }}
                >
                  {/* Back wave */}
                  <path
                    className="clock-water-wave clock-water-wave-2"
                    style={{ opacity: lightMode >= 2 ? 0.6 : 0.5, transition: 'none' }}
                    d="M 0 0 Q 70 12, 140 0 T 280 0 T 420 0 T 560 0 V 320 H 0 Z"
                  />
                  {/* Front wave */}
                  <path
                    className="clock-water-wave"
                    style={{ transition: 'none' }}
                    d="M 0 0 Q 70 -12, 140 0 T 280 0 T 420 0 T 560 0 V 320 H 0 Z"
                  />
                </g>
              </g>
              {/* Progress circle */}
              <circle
                className={`clock-circle-progress ${isPM ? 'pm-color' : ''} ${lightMode >= 2 ? 'aurora-circle-vibrant' : ''}`}
                cx="140"
                cy="140"
                r={radius}
                strokeWidth="12"
                fill="none"
                strokeDasharray={circumference}
                strokeDashoffset={strokeDashoffset}
                strokeLinecap="round"
                transform="rotate(-90 140 140)"
                style={{ opacity: lightMode >= 2 ? 0.7 : 1, transition: 'opacity 0.2s' }}
              />
            </svg>
            <div className={`clock-text ${lightMode >= 2 ? 'clock-text-vibrant' : ''}`}>
              {displayTime}
            </div>
          </div>
        );
      }

      function App() {
        const [rawRows, setRawRows] = useState(() => {
          const saved = localStorage.getItem('cuestionario_rawRows');
          return saved ? JSON.parse(saved) : [];
        });
        const [questions, setQuestions] = useState(() => {
          const saved = localStorage.getItem('cuestionario_questions');
          return saved ? JSON.parse(saved) : [];
        });
        const [currentIndex, setCurrentIndex] = useState(() => {
          const saved = localStorage.getItem('cuestionario_currentIndex');
          return saved ? parseInt(saved, 10) : 0;
        });
        const [options, setOptions] = useState([]);
        const [selectedOption, setSelectedOption] = useState(null);
        const [feedback, setFeedback] = useState(null);
        const [score, setScore] = useState(() => {
          const saved = localStorage.getItem('cuestionario_score');
          return saved ? parseFloat(saved) : 0;
        });
        const [correctCount, setCorrectCount] = useState(() => {
          const saved = localStorage.getItem('cuestionario_correctCount');
          return saved ? parseInt(saved, 10) : 0;
        });
        const [wrongCount, setWrongCount] = useState(() => {
          const saved = localStorage.getItem('cuestionario_wrongCount');
          return saved ? parseInt(saved, 10) : 0;
        });
        const [gameStarted, setGameStarted] = useState(() => {
          return localStorage.getItem('cuestionario_gameStarted') === 'true';
        });
        const [gameOver, setGameOver] = useState(() => {
          return localStorage.getItem('cuestionario_gameOver') === 'true';
        });
        const [loadingFile, setLoadingFile] = useState(false);
        const [disabledOptions, setDisabledOptions] = useState(() => {
          const saved = localStorage.getItem('cuestionario_disabledOptions');
          return saved ? JSON.parse(saved) : [];
        });
        const [failedQuestions, setFailedQuestions] = useState(() => {
          const saved = localStorage.getItem('cuestionario_failedQuestions');
          return saved ? JSON.parse(saved) : [];
        });
        const [gameMode, setGameMode] = useState(() => {
          return localStorage.getItem('cuestionario_gameMode') || null;
        });
        const [prevMode, setPrevMode] = useState(() => {
          return localStorage.getItem('cuestionario_prevMode') || null;
        });
        const [revealed, setRevealed] = useState(false);
        const [confirm, setConfirm] = useState(null); // { message, onAccept }
        const timeoutRef = useRef(null);
        const sfxCorrect = useRef(new Audio("music/Correcto.mp3"));
        const sfxError = useRef(new Audio("music/Error.mp3"));
        const sfxCelebration = useRef(new Audio("music/Celebration.mp3"));
        const celebrationUnlocked = useRef(false);
        const [lightMode, setLightMode] = useState(() => {
          const saved = localStorage.getItem('cuestionario_lightMode');
          return saved !== null ? parseInt(saved, 10) : 0;
        }); // 0 = oscuro, 2 = aurora (sol), 3 = vibrante sin aurora
        const [textVisibility, setTextVisibility] = useState(() => {
          const saved = localStorage.getItem('cuestionario_textVisibility');
          return saved !== null ? parseInt(saved, 10) : 2;
        }); // 0 = invisible, 1 = intenso, 2 = normal (gris)
        const gradientRef = useRef(null);
        const fireworksIntervalRef = useRef(null);
        const touchStartX = useRef(null);
        const touchEndX = useRef(null);
        const module5Ref = useRef(null);
        const [m5Ripple, setM5Ripple] = useState(false);
        const [cometDir, setCometDir] = useState(null);
        const [galaxyDir, setGalaxyDir] = useState(null);
        const [saturnDir, setSaturnDir] = useState(null);
        const [moonDir, setMoonDir] = useState(null);
        const [jupiterDir, setJupiterDir] = useState(null);
        const [marsDir, setMarsDir] = useState(null);

        const totalQuestions = questions.length;

        // --- Persistent Storage Sync ---
        useEffect(() => { localStorage.setItem('cuestionario_rawRows', JSON.stringify(rawRows)); }, [rawRows]);
        useEffect(() => { localStorage.setItem('cuestionario_questions', JSON.stringify(questions)); }, [questions]);
        useEffect(() => { localStorage.setItem('cuestionario_currentIndex', currentIndex); }, [currentIndex]);
        useEffect(() => { localStorage.setItem('cuestionario_score', score); }, [score]);
        useEffect(() => { localStorage.setItem('cuestionario_correctCount', correctCount); }, [correctCount]);
        useEffect(() => { localStorage.setItem('cuestionario_wrongCount', wrongCount); }, [wrongCount]);
        useEffect(() => { localStorage.setItem('cuestionario_gameStarted', gameStarted); }, [gameStarted]);
        useEffect(() => { localStorage.setItem('cuestionario_gameOver', gameOver); }, [gameOver]);
        useEffect(() => { localStorage.setItem('cuestionario_disabledOptions', JSON.stringify(disabledOptions)); }, [disabledOptions]);
        useEffect(() => { localStorage.setItem('cuestionario_failedQuestions', JSON.stringify(failedQuestions)); }, [failedQuestions]);
        useEffect(() => {
          if (gameMode) localStorage.setItem('cuestionario_gameMode', gameMode);
          else localStorage.removeItem('cuestionario_gameMode');
        }, [gameMode]);
        useEffect(() => { localStorage.setItem('cuestionario_lightMode', lightMode); }, [lightMode]);
        useEffect(() => { localStorage.setItem('cuestionario_textVisibility', textVisibility); }, [textVisibility]);
        useEffect(() => {
          if (prevMode) localStorage.setItem('cuestionario_prevMode', prevMode);
          else localStorage.removeItem('cuestionario_prevMode');
        }, [prevMode]);

        // --- Ambient Background Effect ---
        useEffect(() => {
          if (gameMode !== 'module3' || lightMode !== 2 || !gameStarted || gameOver || !gradientRef.current) return;

          let animationFrameId;
          const colors = [
            [62, 35, 255],
            [60, 255, 60],
            [255, 35, 98],
            [45, 175, 230],
            [255, 0, 255],
            [255, 128, 0]
          ];
          
          let step = 0;
          let colorIndices = [0, 1, 2, 3];
          const gradientSpeed = 0.002;

          const updateGradient = () => {
            if (!gradientRef.current) return;

            const c0_0 = colors[colorIndices[0]];
            const c0_1 = colors[colorIndices[1]];
            const c1_0 = colors[colorIndices[2]];
            const c1_1 = colors[colorIndices[3]];

            const istep = 1 - step;
            const r1 = Math.round(istep * c0_0[0] + step * c0_1[0]);
            const g1 = Math.round(istep * c0_0[1] + step * c0_1[1]);
            const b1 = Math.round(istep * c0_0[2] + step * c0_1[2]);
            const color1 = `rgb(${r1},${g1},${b1})`;

            const r2 = Math.round(istep * c1_0[0] + step * c1_1[0]);
            const g2 = Math.round(istep * c1_0[1] + step * c1_1[1]);
            const b2 = Math.round(istep * c1_0[2] + step * c1_1[2]);
            const color2 = `rgb(${r2},${g2},${b2})`;

            gradientRef.current.style.background = `linear-gradient(to right, ${color1} 0%, ${color2} 100%)`;

            step += gradientSpeed;
            if (step >= 1) {
              step %= 1;
              colorIndices[0] = colorIndices[1];
              colorIndices[2] = colorIndices[3];

              colorIndices[1] = (colorIndices[1] + Math.floor(1 + Math.random() * (colors.length - 1))) % colors.length;
              colorIndices[3] = (colorIndices[3] + Math.floor(1 + Math.random() * (colors.length - 1))) % colors.length;
            }
            
            animationFrameId = requestAnimationFrame(updateGradient);
          };

          animationFrameId = requestAnimationFrame(updateGradient);

          return () => {
             cancelAnimationFrame(animationFrameId);
             if (gradientRef.current) gradientRef.current.style.background = '';
          };
        }, [gameMode, lightMode, gameStarted, gameOver]);

        // --- Continuous Fireworks Effect (lightMode === 3) ---
        useEffect(() => {
          if (gameMode === 'module3' && lightMode === 3 && gameStarted && !gameOver) {
            if (!fireworksIntervalRef.current) {
              const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };
              function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
              }

              fireworksIntervalRef.current = setInterval(() => {
                const particleCount = 40;
                // launch from near the top-left and top-right occasionally
                confetti(Object.assign({}, defaults, { 
                  particleCount, 
                  origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } 
                }));
                confetti(Object.assign({}, defaults, { 
                  particleCount, 
                  origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } 
                }));
              }, 400);
            }
          } else {
            if (fireworksIntervalRef.current) {
              clearInterval(fireworksIntervalRef.current);
              fireworksIntervalRef.current = null;
            }
          }

          return () => {
            if (fireworksIntervalRef.current) {
              clearInterval(fireworksIntervalRef.current);
              fireworksIntervalRef.current = null;
            }
          };
        }, [gameMode, lightMode, gameStarted, gameOver]);

        const currentQuestion =
          questions.length && currentIndex < questions.length
            ? questions[currentIndex]
            : null;

        // --- Screen Wake Lock for Module 4 ---



        // Reset when changing question manually or mode
        useEffect(() => {
          if (gameMode === 'module5') {
            setRevealed(false);
            if (module5Ref.current) module5Ref.current.focus();
          }
        }, [currentIndex, gameMode]);

        // --- Comet Timer for Module 5 ---
        useEffect(() => {
          if (gameMode !== 'module5' || !gameStarted || gameOver) {
            setCometDir(null);
            return;
          }

          let timeoutId;
          let resetTimeoutId;

          const scheduleComet = () => {
            // Entre 3 y 9 minutos
            const delay = Math.floor(Math.random() * (540000 - 180000 + 1)) + 180000;

            timeoutId = setTimeout(() => {
              // Dirección aleatoria (0 a 3)
              const randomDir = Math.floor(Math.random() * 4);
              setCometDir(randomDir);
              
              // La animación dura 15s en CSS, reiniciamos el estado después de 16s
              resetTimeoutId = setTimeout(() => {
                setCometDir(null);
                scheduleComet();
              }, 16000);
            }, delay);
          };

          scheduleComet();

          return () => {
            if (timeoutId) clearTimeout(timeoutId);
            if (resetTimeoutId) clearTimeout(resetTimeoutId);
          };
        }, [gameMode, gameStarted, gameOver]);

        // --- Galaxy Timer for Module 5 ---
        useEffect(() => {
          if (gameMode !== 'module5' || !gameStarted || gameOver) {
            setGalaxyDir(null);
            return;
          }

          let timeoutId;
          let resetTimeoutId;

          const scheduleGalaxy = () => {
            // Entre 3 y 9 minutos
            const delay = Math.floor(Math.random() * (540000 - 180000 + 1)) + 180000;

            timeoutId = setTimeout(() => {
              const randomDir = Math.floor(Math.random() * 4);
              setGalaxyDir(randomDir);
              // La animación dura 45s en CSS, reiniciamos el estado después de 46s
              resetTimeoutId = setTimeout(() => {
                setGalaxyDir(null);
                scheduleGalaxy();
              }, 46000);
            }, delay);
          };

          scheduleGalaxy();

          return () => {
            if (timeoutId) clearTimeout(timeoutId);
            if (resetTimeoutId) clearTimeout(resetTimeoutId);
          };
        }, [gameMode, gameStarted, gameOver]);

        // --- Saturn Timer for Module 5 ---
        useEffect(() => {
          if (gameMode !== 'module5' || !gameStarted || gameOver) {
            setSaturnDir(null);
            return;
          }

          let timeoutId;
          let resetTimeoutId;

          const scheduleSaturn = () => {
            // Entre 3 y 9 minutos
            const delay = Math.floor(Math.random() * (540000 - 180000 + 1)) + 180000;

            timeoutId = setTimeout(() => {
              const randomDir = Math.floor(Math.random() * 4);
              setSaturnDir(randomDir);
              // La animación dura 15s en CSS, reiniciamos el estado después de 16s
              resetTimeoutId = setTimeout(() => {
                setSaturnDir(null);
                scheduleSaturn();
              }, 16000);
            }, delay);
          };

          scheduleSaturn();

          return () => {
            if (timeoutId) clearTimeout(timeoutId);
            if (resetTimeoutId) clearTimeout(resetTimeoutId);
          };
        }, [gameMode, gameStarted, gameOver]);

        // --- Moon Timer for Module 5 ---
        useEffect(() => {
          if (gameMode !== 'module5' || !gameStarted || gameOver) {
            setMoonDir(null);
            return;
          }

          let timeoutId;
          let resetTimeoutId;

          const scheduleMoon = () => {
            // Entre 3 y 9 minutos
            const delay = Math.floor(Math.random() * (540000 - 180000 + 1)) + 180000;

            timeoutId = setTimeout(() => {
              const randomDir = Math.floor(Math.random() * 4);
              setMoonDir(randomDir);
              // La animación dura 20s en CSS, reiniciamos el estado después de 21s
              resetTimeoutId = setTimeout(() => {
                setMoonDir(null);
                scheduleMoon();
              }, 21000);
            }, delay);
          };

          scheduleMoon();

          return () => {
            if (timeoutId) clearTimeout(timeoutId);
            if (resetTimeoutId) clearTimeout(resetTimeoutId);
          };
        }, [gameMode, gameStarted, gameOver]);

        // --- Jupiter Timer for Module 5 ---
        useEffect(() => {
          if (gameMode !== 'module5' || !gameStarted || gameOver) {
            setJupiterDir(null);
            return;
          }

          let timeoutId;
          let resetTimeoutId;

          const scheduleJupiter = () => {
            // Entre 3 y 9 minutos
            const delay = Math.floor(Math.random() * (540000 - 180000 + 1)) + 180000;

            timeoutId = setTimeout(() => {
              const randomDir = Math.floor(Math.random() * 4);
              setJupiterDir(randomDir);
              // La animación dura 25s
              resetTimeoutId = setTimeout(() => {
                setJupiterDir(null);
                scheduleJupiter();
              }, 26000);
            }, delay);
          };

          scheduleJupiter();

          return () => {
            if (timeoutId) clearTimeout(timeoutId);
            if (resetTimeoutId) clearTimeout(resetTimeoutId);
          };
        }, [gameMode, gameStarted, gameOver]);

        // --- Mars Timer for Module 5 ---
        useEffect(() => {
          if (gameMode !== 'module5' || !gameStarted || gameOver) {
            setMarsDir(null);
            return;
          }

          let timeoutId;
          let resetTimeoutId;

          const scheduleMars = () => {
            // Entre 3 y 9 minutos
            const delay = Math.floor(Math.random() * (540000 - 180000 + 1)) + 180000;

            timeoutId = setTimeout(() => {
              const randomDir = Math.floor(Math.random() * 4);
              setMarsDir(randomDir);
              // La animación dura 18s
              resetTimeoutId = setTimeout(() => {
                setMarsDir(null);
                scheduleMars();
              }, 19000);
            }, delay);
          };

          scheduleMars();

          return () => {
            if (timeoutId) clearTimeout(timeoutId);
            if (resetTimeoutId) clearTimeout(resetTimeoutId);
          };
        }, [gameMode, gameStarted, gameOver]);
        
        // --- Screen Wake Lock (Module 4 & 5) ---
        useEffect(() => {
          let wakeLock = null;

          const requestWakeLock = async () => {
            if ('wakeLock' in navigator && document.visibilityState === 'visible') {
              try {
                wakeLock = await navigator.wakeLock.request('screen');
                console.log('Screen Wake Lock is active (Always On mode enabled)');
              } catch (err) {
                console.warn('Wake Lock request failed:', err);
              }
            }
          };

          const releaseWakeLock = () => {
            if (wakeLock) {
              wakeLock.release().then(() => {
                console.log('Screen Wake Lock released');
                wakeLock = null;
              }).catch(() => {});
            }
          };

          const handleVisibilityChange = () => {
            const isTargetMode = gameMode === 'module4' || gameMode === 'module5';
            if (document.visibilityState === 'visible' && gameStarted && !gameOver && isTargetMode) {
              requestWakeLock();
            }
          };

          const isTargetMode = gameMode === 'module4' || gameMode === 'module5';
          if (gameStarted && !gameOver && isTargetMode) {
            requestWakeLock();
            document.addEventListener('visibilitychange', handleVisibilityChange);
          } else {
            releaseWakeLock();
          }

          return () => {
            releaseWakeLock();
            document.removeEventListener('visibilitychange', handleVisibilityChange);
          };
        }, [gameStarted, gameOver, gameMode]);
        
        // --- Keyboard Controls for Module 3 & 5 (Robust Ref-based) ---
        const navStateRef = useRef({ revealed, currentIndex });
        useEffect(() => {
          navStateRef.current = { revealed, currentIndex };
        }, [revealed, currentIndex]);

        useEffect(() => {
          const isNavModule = (gameMode === 'module3' || gameMode === 'module5');
          if (!isNavModule || !gameStarted || gameOver) return;

          const handleKeyDown = (e) => {
            const { revealed: isRevealed, currentIndex: idx } = navStateRef.current;
            
            switch (e.key) {
              case ' ':
              case 'Enter':
                if (e.target.tagName !== 'BUTTON') {
                  e.preventDefault();
                  setRevealed(!isRevealed);
                }
                break;
              case 'ArrowRight':
                e.preventDefault();
                setRevealed(false);
                goToNextQuestion();
                break;
              case 'ArrowLeft':
                e.preventDefault();
                if (idx > 0) {
                  setRevealed(false);
                  setCurrentIndex(idx - 1);
                }
                break;
              case 'Escape':
                e.preventDefault();
                handleChangeModule();
                break;
              default:
                break;
            }
          };

          window.addEventListener('keydown', handleKeyDown);
          return () => window.removeEventListener('keydown', handleKeyDown);
        }, [gameMode, gameStarted, gameOver]);

        // --- Core Effects ---

        const progressPercent = useMemo(() => {
          if (!totalQuestions) return 0;
          return ((currentIndex + 1) / totalQuestions) * 100;
        }, [currentIndex, totalQuestions]);

        useEffect(() => {
          if (questions.length > 0 && currentIndex < questions.length) {
            prepareOptionsForCurrentQuestion();
          } else {
            setOptions([]);
          }
          // eslint-disable-next-line react-hooks/exhaustive-deps
        }, [questions, currentIndex]);

        useEffect(() => {
          return () => {
            if (timeoutRef.current) clearTimeout(timeoutRef.current);
          };
        }, []);

        useEffect(() => {
          if (gameOver) {
            sfxCelebration.current.currentTime = 0;
            sfxCelebration.current.play().catch(() => { });
          }
        }, [gameOver]);

        const handleRemoveData = () => {
          if (window.confirm('¿Estás seguro de que deseas borrar los datos guardados y empezar de cero?')) {
            localStorage.clear();
            setRawRows([]);
            setQuestions([]);
            setGameStarted(false);
            setGameOver(false);
            setGameMode(null);
            setCurrentIndex(0);
            setScore(0);
            setCorrectCount(0);
            setWrongCount(0);
            setDisabledOptions([]);
            setFailedQuestions([]);
            setRevealed(false);
            setLoadingFile(false);
          }
        };

        function handleFileChange(e) {
          const file = e.target.files?.[0];
          if (!file) return;
          setLoadingFile(true);

          const reader = new FileReader();
          reader.onload = (evt) => {
            try {
              const data = evt.target.result;
              const workbook = XLSX.read(data, { type: "array" });
              const firstSheetName = workbook.SheetNames[0];
              const worksheet = workbook.Sheets[firstSheetName];
              const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

              const parsed = rows
                .filter(
                  (row) =>
                    Array.isArray(row) &&
                    row.length >= 2 &&
                    row[0] != null &&
                    row[1] != null &&
                    String(row[1]).trim() !== ""
                )
                .map((row) => ({
                  question: String(row[0]).trim(),
                  answer: String(row[1]).trim(),
                }));

              if (parsed.length < 2) {
                alert(
                  "El archivo debe tener al menos dos filas válidas con pregunta (columna 1) y respuesta (columna 2)."
                );
                setLoadingFile(false);
                return;
              }

              setRawRows(parsed);
              setGameStarted(false);
              setGameOver(false);
              setGameMode(null);
              setSelectedOption(null);
              setFeedback(null);
            } catch (error) {
              console.error(error);
              alert("Hubo un problema al leer el archivo Excel.");
            } finally {
              setLoadingFile(false);
            }
          };
          reader.onerror = () => {
            alert("No se pudo leer el archivo.");
            setLoadingFile(false);
          };

          reader.readAsArrayBuffer(file);
          e.target.value = "";
        }

        function prepareOptionsForCurrentQuestion() {
          const current = questions[currentIndex];
          if (!current) return;

          const otherAnswers = questions
            .filter((_, idx) => idx !== currentIndex)
            .map((q) => q.answer)
            .filter((a) => a !== current.answer);

          // Shuffle distractors and pick up to 3
          const shuffledOthers = shuffleArray(otherAnswers);
          const numDistractors = Math.min(3, shuffledOthers.length);
          const distractors = shuffledOthers.slice(0, numDistractors).map((text) => ({
            text,
            isCorrect: false,
          }));

          const opts = shuffleArray([
            { text: current.answer, isCorrect: true },
            ...distractors,
          ]);

          setOptions(opts);
          setSelectedOption(null);
          setFeedback(null);
          setDisabledOptions([]);
        }

        function playSound(ref) {
          try {
            ref.current.currentTime = 0;
            ref.current.play();
          } catch (_) { }
        }

        function triggerConfetti() {
          if (typeof confetti !== "function") return;
          confetti({
            particleCount: 120,
            spread: 70,
            origin: { y: 0.6 },
          });
        }

        function handleOptionClick(option) {
          if (!options.length || selectedOption || disabledOptions.includes(option.text)) return;

          // Desbloquear celebration en el primer gesto del usuario
          if (!celebrationUnlocked.current) {
            celebrationUnlocked.current = true;
            sfxCelebration.current.play().then(() => {
              sfxCelebration.current.pause();
              sfxCelebration.current.currentTime = 0;
            }).catch(() => { });
          }

          setSelectedOption(option);

          const isCorrect = option.isCorrect;
          if (isCorrect) {
            setFeedback({ type: "correct", message: "¡Correcto!" });
            playSound(sfxCorrect);
            const pts = Math.round(100 / questions.length);
            setScore((s) => s + (disabledOptions.length === 0 ? pts : 0));
            if (disabledOptions.length === 0) setCorrectCount((c) => c + 1);
            triggerConfetti();
            if (timeoutRef.current) clearTimeout(timeoutRef.current);
            timeoutRef.current = setTimeout(() => {
              goToNextQuestion();
            }, 1600);
          } else {
            // Track failed question (only first wrong attempt per question)
            if (disabledOptions.length === 0) {
              const current = questions[currentIndex];
              setFailedQuestions((prev) => {
                const alreadyTracked = prev.some(
                  (q) => q.answer === current.answer && q.question === current.question
                );
                return alreadyTracked ? prev : [...prev, current];
              });
            }
            setFeedback({ type: "wrong", message: "Incorrecto. ¡Intenta de nuevo!" });
            playSound(sfxError);
            setWrongCount((c) => c + 1);
            if (timeoutRef.current) clearTimeout(timeoutRef.current);
            timeoutRef.current = setTimeout(() => {
              setDisabledOptions((prev) => [...prev, option.text]);
              setSelectedOption(null);
              setFeedback(null);
            }, 1600);
          }
        }

        function goToNextQuestion() {
          setRevealed(false);
          setCurrentIndex((idx) => {
            if (idx + 1 >= questions.length) {
              setGameOver(true);
              return idx;
            }
            return idx + 1;
          });
          setSelectedOption(null);
          setFeedback(null);
        }

        function handleRestart() {
          if (!rawRows.length) {
            setGameStarted(false);
            setGameOver(false);
            setGameMode(null);
            return;
          }
          startModule(gameMode, true);
        }

        function handleReviewFailed() {
          if (!failedQuestions.length) return;
          const shuffled = shuffleArray(failedQuestions);
          setQuestions(shuffled);
          setCurrentIndex(0);
          setScore(0);
          setCorrectCount(0);
          setWrongCount(0);
          setGameOver(false);
          setGameStarted(true);
          setSelectedOption(null);
          setFeedback(null);
          setFailedQuestions([]);
          setRevealed(false);
        }

        function startModule(mode, forceReset = false) {
          const studyModules = ['module3', 'module4', 'module5'];
          const isStudyModule = studyModules.includes(mode);
          const wasStudyModule = studyModules.includes(prevMode);
          const shouldContinue = !forceReset && isStudyModule && wasStudyModule && questions.length > 0 && !gameOver;

          if (!shouldContinue) {
            const shuffled = shuffleArray(rawRows);
            setQuestions(shuffled);
            setCurrentIndex(0);
            setScore(0);
            setCorrectCount(0);
            setWrongCount(0);
            setFailedQuestions([]);
          }

          setGameOver(false);
          setGameStarted(true);
          setGameMode(mode);
          setPrevMode(mode); // Actualizar para la próxima transición
          setSelectedOption(null);
          setFeedback(null);
          setRevealed(false);
          // Mantener estado de animación (lightMode y textVisibility) al reiniciar la ronda
        }

        function handleChangeModule() {
          setPrevMode(gameMode);
          setGameStarted(false);
          setGameOver(false);
          setGameMode(null);
          setSelectedOption(null);
          setFeedback(null);
          setRevealed(false);
        }

        function askConfirm(message, onAccept) {
          setConfirm({ message, onAccept });
        }

        function closeConfirm() {
          setConfirm(null);
        }

        function handleFlashcardNext() {
          setRevealed(false);
          goToNextQuestion();
        }

        const handleTouchStart = (e) => {
          touchStartX.current = e.targetTouches[0].clientX;
        };

        const handleTouchMove = (e) => {
          touchEndX.current = e.targetTouches[0].clientX;
        };

        const handleTouchEnd = () => {
          if (!touchStartX.current || !touchEndX.current) return;
          const distance = touchStartX.current - touchEndX.current;
          const minSwipeDistance = 50;
          if (distance > minSwipeDistance) {
            // Swipe left -> Next question
            setRevealed(false);
            goToNextQuestion();
          } else if (distance < -minSwipeDistance) {
            // Swipe right -> Previous question
            if (currentIndex > 0) {
              setRevealed(false);
              setCurrentIndex((prev) => Math.max(0, prev - 1));
            }
          }
          // Reset
          touchStartX.current = null;
          touchEndX.current = null;
        };


        const successPercentage =
          correctCount + wrongCount === 0
            ? 0
            : Math.round((correctCount / (correctCount + wrongCount)) * 100);

        return (

                    </label>

                    </p>
                  </div>

                  </p>
                  <p>Columna 1: pregunta · Columna 2: respuesta correcta.</p>

              {rawRows.length > 0 && !gameStarted && !gameOver && (

                    <button

                    <button

                    <button

                      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">

                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>

                      </svg>

              {gameStarted && !gameOver && gameMode === 'module4' && currentQuestion && (

              {gameStarted && !gameOver && gameMode === 'module6' && currentQuestion && (
                <main

                  onTouchMove={handleTouchMove}

                  <div className="m6-card">

                      Pregunta {currentIndex + 1} / {totalQuestions}
                    </div>
                    <div className="question-text">{currentQuestion.question}</div>
                  </div>
                  {!revealed ? (
                    <button className="reveal-btn" onClick={() => {
                      if (!celebrationUnlocked.current) {
                        celebrationUnlocked.current = true;
                        sfxCelebration.current.play().then(() => {
                          sfxCelebration.current.pause();
                          sfxCelebration.current.currentTime = 0;
                        }).catch(() => { });
                      }
                      playSound(sfxCorrect);
                      setRevealed(true);
                    }}>
                      👁️ Ver respuesta
                    </button>
                  ) : (
                    <>
                      <div className="answer-reveal">{currentQuestion.answer}</div>
                      <button className="reveal-next-btn" onClick={handleFlashcardNext}>
                        {currentIndex + 1 < totalQuestions ? 'Siguiente →' : '✅ Ver resultados'}
                      </button>
                    </>
                  )}
                </main>
              )}

              {gameStarted && !gameOver && gameMode === 'flashcard' && (
                <div className="bottom-actions">
                  <button className="ghost-button" onClick={() => askConfirm('¿Reiniciar la ronda desde el principio?', handleRestart)}>
                    Reiniciar ronda
                  </button>
                  <button className="ghost-button" onClick={handleChangeModule}>
                    🔀 Cambiar módulo
                  </button>
                </div>
              )}

              {confirm && (
                <div className="confirm-overlay">
                  <div className="confirm-card">
                    <p className="confirm-message">{confirm.message}</p>
                    <div className="confirm-actions">
                      <button className="confirm-cancel" onClick={closeConfirm}>Cancelar</button>
                      <button className="confirm-accept" onClick={() => { confirm.onAccept(); closeConfirm(); }}>Aceptar</button>
                    </div>
                  </div>
                </div>
              )}

              {gameOver && (
                <section className="results-card">
                  {gameMode === 'quiz' ? (
                    <>
                      <h2>Resultados finales</h2>
                      <div className="results-grid">
                        <div className="result-item">
                          <span className="result-label">Total de preguntas</span>
                          <span className="result-value">{totalQuestions}</span>
                        </div>
                        <div className="result-item">
                          <span className="result-label">Aciertos</span>
                          <span className="result-value stat-ok">{correctCount}</span>
                        </div>
                        <div className="result-item">
                          <span className="result-label">Errores</span>
                          <span className="result-value stat-bad">{wrongCount}</span>
                        </div>
                        <div className="result-item">
                          <span className="result-label">Porcentaje de éxito</span>
                          <span className="result-value">
                            {successPercentage}<span className="result-unit">%</span>
                          </span>
                        </div>
                        <div className="result-item">
                          <span className="result-label">Puntaje final</span>
                          <span className="result-value">{score}</span>
                        </div>
                      </div>
                    </>
                  ) : (
                    <>
                      <h2>¡Ronda completada!</h2>
                      <div className="results-grid">
                        <div className="result-item">
                          <span className="result-label">Tarjetas revisadas</span>
                          <span className="result-value">{totalQuestions}</span>
                        </div>
                      </div>
                    </>
                  )}
                  <div className="results-actions">
                    <button className="restart-button" onClick={handleRestart}>
                      🔁 Repetir ronda
                    </button>
                    <button className="change-module-btn" onClick={handleChangeModule}>
                      🔀 Cambiar módulo
                    </button>
                    {gameMode === 'quiz' && failedQuestions.length > 0 && (
                      <button className="review-button" onClick={handleReviewFailed}>
                        🔁 Repasar {failedQuestions.length} error{failedQuestions.length !== 1 ? "es" : ""}
                      </button>
                    )}
                  </div>
                </section>
              )}

              {gameStarted && !gameOver && gameMode === 'quiz' && (
                <div className="bottom-actions">
                  <button className="ghost-button" onClick={handleRestart}>
                    Reiniciar ronda
                  </button>
                  <button className="ghost-button" onClick={handleChangeModule}>
                    🔀 Cambiar módulo
                  </button>
                </div>
              )}

              <footer className="app-footer" style={{ display: (gameMode === 'module3' || gameMode === 'module4') ? 'none' : '' }}>
                <span>
                  Carga tu Excel y convierte el estudio en un juego interactivo.
                </span>
              </footer>
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    }
  </script>
</body>

</html>
