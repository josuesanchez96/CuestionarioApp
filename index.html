  <!-- Turso libSQL Native HTTP Client (Bypass Browser Module Restrictions) -->
  <script>
    window.createTursoClient = function (config) {
      let finalUrl = config.url;
      if (finalUrl.startsWith('libsql://')) {
        finalUrl = finalUrl.replace('libsql://', 'https://');
      }
      if (finalUrl.endsWith('/')) finalUrl = finalUrl.slice(0, -1);
      finalUrl += '/v2/pipeline';

      const mapArgs = (args) => {
        return (args || []).map(a => {
          if (a === null || a === undefined) return { type: "null" };
          if (typeof a === 'number') return { type: Number.isInteger(a) ? "integer" : "float", value: String(a) };
          return { type: "text", value: String(a) };
        });
      };

      const doFetch = async (requests) => {
        const res = await fetch(finalUrl, {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + config.authToken,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ requests: [...requests, { type: "close" }] })
        });
        if (!res.ok) {
          const text = await res.text();
          throw new Error("HTTP " + res.status + ": " + text);
        }
        return await res.json();
      };

      const unwrap = (val) => {
        if (!val) return null;
        if (val.type === "integer") return parseInt(val.value, 10);
        if (val.type === "float") return parseFloat(val.value);
        if (val.type === "null") return null;
        return val.value; // text, blob, etc
      };

      return {
        async execute(query) {
          const sql = typeof query === 'string' ? query : query.sql;
          const args = typeof query === 'string' ? [] : (query.args || []);

          const payload = [{ type: "execute", stmt: { sql, args: mapArgs(args) } }];
          const res = await doFetch(payload);

          const firstResult = res.results[0];
          if (firstResult && firstResult.type === "error") {
            throw new Error(firstResult.error.message);
          }

          const rs = firstResult && firstResult.response && firstResult.response.result;
          if (!rs) return { rows: [] };

          const cols = (rs.cols || []).map(c => c.name);
          const rows = (rs.rows || []).map(rowArr => {
            const obj = {};
            for (let i = 0; i < cols.length; i++) {
              obj[cols[i]] = unwrap(rowArr[i]);
            }
            return obj;
          });
          return { rows };
        },
        async batch(queries) {
          const reqs = queries.map(q => ({
            type: "execute",
            stmt: { sql: q.sql, args: mapArgs(q.args) }
          }));
          const res = await doFetch(reqs);
          const errRes = res.results.find(r => r && r.type === "error");
          if (errRes) throw new Error(errRes.error.message);
          return true;
        }
      };
    };
  </script>

        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;

      function Clock({ lightMode }) {
        const [time, setTime] = useState(new Date());

        useEffect(() => {
          const timer = setInterval(() => setTime(new Date()), 1000);
          return () => clearInterval(timer);
        }, []);

        const minutes = time.getMinutes();
        const seconds = time.getSeconds();
        const hours = time.getHours();
        const isPM = hours >= 12;

        // Calculate progress smoothly over a 24 hour period
        // 24 hours * 60 minutes * 60 seconds
        const totalSecondsInDay = 24 * 60 * 60;
        const currentSeconds = (hours * 60 * 60) + (minutes * 60) + seconds;
        const progress = currentSeconds / totalSecondsInDay;

        // SVG Circle math
        const radius = 120;
        const circumference = 2 * Math.PI * radius;
        const strokeDashoffset = circumference - progress * circumference;

        // Water fill math (0 to 60 minutes)
        const minuteProgress = minutes / 60;

        // El círculo empieza visualmente más arriba (por el radio y el clipPath)
        // Mapeamos el progreso para que en 0 min esté en y=260 (apenas visible) 
        // y en 60 min esté en y=20 (lleno completamente)
        const waterY = 260 - (240 * minuteProgress);

        // Formato 12 horas: medianoche es 0, mediodía es 12
        const displayHours = hours === 12 ? 12 : hours % 12;
        const displayMinutes = minutes < 10 ? '0' + minutes : minutes;
        const displayTime = `${displayHours}:${displayMinutes}`;

        return (
          <div className="clock-container">
            <svg className="clock-svg" width="280" height="280" viewBox="0 0 280 280" key="m3-stable-clock">
              <defs>
                <clipPath id="circleMask">
                  <circle cx="140" cy="140" r={radius - 6} />
                </clipPath>
              </defs>
              {/* Background circle */}
              <circle
                className="clock-circle-bg"
                cx="140"
                cy="140"
                r={radius}
                strokeWidth="12"
                fill="none"
              />
              {/* Water fill group */}
              <g clipPath="url(#circleMask)">
                <g
                  style={{
                    transform: `translateY(${waterY}px)`,
                    transition: 'transform 1s ease-in-out'
                  }}
                >
                  {/* Back wave */}
                  <path
                    className="clock-water-wave clock-water-wave-2"
                    style={{ transition: 'none' }}
                    d="M 0 0 Q 70 12, 140 0 T 280 0 T 420 0 T 560 0 V 320 H 0 Z"
                  />
                  {/* Front wave */}
                  <path

                    style={{ transition: 'none' }}
                    d="M 0 0 Q 70 -12, 140 0 T 280 0 T 420 0 T 560 0 V 320 H 0 Z"

              {displayTime}

        );

      function AnalogClock() {
        const [time, setTime] = React.useState(new Date());

        React.useEffect(() => {
          const timer = setInterval(() => setTime(new Date()), 1000);
          return () => clearInterval(timer);
        }, []);

        const minutes = time.getMinutes();
        const hours = time.getHours();

        return (
          <div className="m4-aod-analog">
            <div className="m4-clock-face">
              {[...Array(12)].map((_, i) => {
                const num = i + 1;
                const angle = num * 30;
                const isMain = [12, 3, 6, 9].includes(num);
                return (
                  <div 
                    key={i} 
                    className={`m4-clock-number ${isMain ? 'm4-main-num' : ''}`}

        const runAudioCycle = async () => {
          if (!audioRef.current.playing || questions.length === 0) return;
          
          const idxToUse = audioRef.current.index;
          const row = questions[idxToUse];
          if (!row) return;

          // Actualizar MediaSession (Pantalla bloqueada y barra de notificaciones)
          if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
              title: `Pregunta ${idxToUse + 1}`,
              artist: activeQuiz || 'Estudio Pro',
              album: 'Audio Estudio 3x3x3',

              ]
            });
            navigator.mediaSession.playbackState = 'playing';

            // Configurar manejadores de botones en la notificación
            navigator.mediaSession.setActionHandler('play', () => toggleAudio(true));
            navigator.mediaSession.setActionHandler('pause', () => toggleAudio(false));
            navigator.mediaSession.setActionHandler('previoustrack', () => skipAudio(-1));
            navigator.mediaSession.setActionHandler('nexttrack', () => skipAudio(1));
          }

          const steps = [
            { text: `Pregunta: ${row.question}`, type: 'Q' },
            { text: row.question, type: 'Q' },
            { text: row.question, type: 'Q' },
            { text: `Respuesta: ${row.answer}`, type: 'A' },
            { text: row.answer, type: 'A' },
            { text: row.answer, type: 'A' },

            { text: row.keywords || '', type: 'K' },
            { text: row.keywords || '', type: 'K' }
          ];

          const currentStep = steps[audioRef.current.step];
          if (!currentStep || !currentStep.text.trim()) {
              // Saltar pasos vacíos (ej keywords no generadas)
              audioRef.current.step++;
              if (audioRef.current.step > 8) {
                  audioRef.current.step = 0;
                  let nextIdx = audioRef.current.index + 1;
                  if (nextIdx >= questions.length) nextIdx = 0;
                  audioRef.current.index = nextIdx;
                  setCurrentIndex(nextIdx);

              runAudioCycle();
              return;

          const utterance = new SpeechSynthesisUtterance(currentStep.text);
          utterance.lang = 'es-ES';
          utterance.rate = audioSpeed;
          
          utterance.onstart = () => {
            audioRef.current.startTime = Date.now();
          };

          utterance.onend = () => {
            if (!audioRef.current.playing) return;
            
            // Medir cuánto tardó el audio en hablar
            const duration = Date.now() - audioRef.current.startTime;
            audioRef.current.lastDuration = duration;

            setTimeout(() => {
              if (!audioRef.current.playing) return;
              
              audioRef.current.step++;
              if (audioRef.current.step > 8) {
                audioRef.current.step = 0;
                let nextIdx = audioRef.current.index + 1;
                
                // BUCLE INFINITO: Si llegamos al final, reiniciamos a 0
                if (nextIdx >= questions.length) {
                    nextIdx = 0; 
                }
                
                audioRef.current.index = nextIdx;
                setCurrentIndex(nextIdx);
              }
              setAudioStep(audioRef.current.step);
              runAudioCycle();
            }, duration); // Silencio dinámico: 1:1 con el tiempo de habla
          };

        }, [gameMode, gameStarted, gameOver]);

        // --- Screen Wake Lock (Study Modules: 3, 4 & 5) ---
        useEffect(() => {
          let wakeLock = null;

          const requestWakeLock = async () => {
            if ('wakeLock' in navigator && document.visibilityState === 'visible') {
              try {
                wakeLock = await navigator.wakeLock.request('screen');
                console.log('Screen Wake Lock is active (Always On mode enabled)');
              } catch (err) {
                console.warn('Wake Lock request failed:', err);
              }
            }
          };

          const releaseWakeLock = () => {
            if (wakeLock) {
              wakeLock.release().then(() => {
                console.log('Screen Wake Lock released');
                wakeLock = null;
              }).catch(() => { });
            }
          };

          const handleVisibilityChange = () => {
            const isTargetMode = gameMode === 'module3' || gameMode === 'module4' || gameMode === 'module5' || gameMode === 'module8';
            if (document.visibilityState === 'visible' && gameStarted && !gameOver && isTargetMode) {
              requestWakeLock();
            }
          };

          const isTargetMode = gameMode === 'module3' || gameMode === 'module4' || gameMode === 'module5' || gameMode === 'module8';
          if (gameStarted && !gameOver && isTargetMode) {
            requestWakeLock();
            document.addEventListener('visibilitychange', handleVisibilityChange);
          } else {
            releaseWakeLock();
          }

          return () => {
            releaseWakeLock();
            document.removeEventListener('visibilitychange', handleVisibilityChange);
          };
        }, [gameStarted, gameOver, gameMode]);

        // --- Keyboard Controls for Module 3 & 5 (Robust Ref-based) ---
        const navStateRef = useRef({ revealed, currentIndex });
        useEffect(() => {
          navStateRef.current = { revealed, currentIndex };
        }, [revealed, currentIndex]);

        useEffect(() => {
          const isNavModule = ['module3', 'module4', 'module5', 'module6', 'module8'].includes(gameMode);
          if (!isNavModule || !gameStarted || gameOver) return;

          const handleKeyDown = (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            const { revealed: isRevealed, currentIndex: idx } = navStateRef.current;

            switch (e.key) {
              case ' ':
              case 'Enter':
                if (e.target.tagName !== 'BUTTON') {
                  e.preventDefault();
                  setRevealed(!isRevealed);
                }
                break;
              case 'ArrowRight':
                e.preventDefault();
                setRevealed(false);
                goToNextQuestion();
                break;
              case 'ArrowLeft':
                e.preventDefault();
                if (idx > 0) {
                  setRevealed(false);
                  setCurrentIndex(idx - 1);
                }
                break;
              case 'Escape':
                e.preventDefault();
                handleChangeModule();
                break;
              case 's':
              case 'S':
                e.preventDefault();
                setLightMode((prev) => (prev === 0 ? 1 : 0));
                break;
              default:
                break;
            }
          };

          window.addEventListener('keydown', handleKeyDown);
          return () => window.removeEventListener('keydown', handleKeyDown);
        }, [gameMode, gameStarted, gameOver]);

        // --- Sync GameState with manual Fullscreen exit (Esc) ---
        useEffect(() => {
          const handleFsChange = () => {
            const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
            if (!isFs && gameMode === 'module4' && gameStarted) {
              handleChangeModule();
            }
          };
          document.addEventListener('fullscreenchange', handleFsChange);
          document.addEventListener('webkitfullscreenchange', handleFsChange);
          document.addEventListener('msfullscreenchange', handleFsChange);
          return () => {
            document.removeEventListener('fullscreenchange', handleFsChange);
            document.removeEventListener('webkitfullscreenchange', handleFsChange);
            document.removeEventListener('msfullscreenchange', handleFsChange);
          };
        }, [gameMode, gameStarted]);

        // --- Core Effects ---

        const progressPercent = useMemo(() => {
          if (!totalQuestions) return 0;
          return ((currentIndex + 1) / totalQuestions) * 100;
        }, [currentIndex, totalQuestions]);

        useEffect(() => {

            setOptions([]);

        }, [questions, currentIndex]);

        useEffect(() => {

        }, []);

        function handleFileChange(e) {
          const file = e.target.files?.[0];
          if (!file) return;
          setLoadingFile(true);

          const reader = new FileReader();
          reader.onload = (evt) => {
            try {
              const data = evt.target.result;
              const workbook = XLSX.read(data, { type: "array" });
              const firstSheetName = workbook.SheetNames[0];
              const worksheet = workbook.Sheets[firstSheetName];
              const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

              const parsed = rows
                .filter(
                  (row) =>
                    Array.isArray(row) &&
                    row.length >= 2 &&
                    row[0] != null &&
                    row[1] != null &&
                    String(row[1]).trim() !== ""
                )
                .map((row) => ({
                  question: String(row[0]).trim(),
                  answer: String(row[1]).trim(),
                }));

              if (parsed.length < 2) {
                alert(
                  "El archivo debe tener al menos dos filas válidas con pregunta (columna 1) y respuesta (columna 2)."
                );
                setLoadingFile(false);
                return;
              }

              const currentQuiz = activeQuiz || 'General';

              // Detectar cuáles preguntas son REALMENTE NUEVAS basándose en la lista actual
              const existingContent = new Set(rawRows.map(r => (r.question || "").trim() + "|||" + (r.answer || "").trim()));
              const newRows = parsed.filter(p => {
                return !existingContent.has(p.question + "|||" + p.answer);
              });

              if (newRows.length === 0) {
                alert("ℹ️ El Excel no contenía preguntas nuevas para este cuestionario.");
                setLoadingFile(false);
                return;
              }

              // Agregar solo las nuevas a la interfaz local de inmediato
              setRawRows(prev => [...prev, ...newRows.map(p => ({
                id: currentQuiz === 'General' ? (p.question + p.answer) : (currentQuiz + "_" + p.question + p.answer),
                question: p.question,
                answer: p.answer
              }))]);

              // Guardar en Turso si está conectado
              if (tursoClient.current && tursoConnected) {
                (async () => {
                  try {
                    const queries = [];
                    for (const p of newRows) {
                      const kw = await generateKeywords(p.question, p.answer);
                      queries.push({
                        sql: "INSERT OR IGNORE INTO turso_questions (id, question, answer, quiz, keywords, updated_at) VALUES (?, ?, ?, ?, ?, (cast(strftime('%s','now') as int)))",
                        args: [
                          currentQuiz === 'General' ? (p.question + p.answer) : (currentQuiz + "_" + p.question + p.answer),
                          p.question,
                          p.answer,
                          currentQuiz,
                          kw
                        ]
                      });
                    }
                    await tursoClient.current.batch(queries);
                    setAvailableQuizzes(prev => {
                      const others = prev.filter(q => q !== currentQuiz);
                      return [currentQuiz, ...others];
                    });
                    alert(`✅ Se agregaron ${newRows.length} pregunta(s) nueva(s) con palabras clave al cuestionario '${currentQuiz}'.`);
                    loadQuizFromDB(currentQuiz, false);
                  } catch (err) {
                    console.error(err);
                    setTursoError("Error subiendo datos: " + (err.message || err));
                    alert("❌ Error subiendo a Turso: " + (err.message || err));
                  }
                })();
              } else {
                alert(`⚠️ Se guardaron ${newRows.length} pregunta(s) localmente, pero Turso NO estaba conectado.`);
              }

              setCurrentIndex(0);
              setScore(0);
              setCorrectCount(0);
              setWrongCount(0);
              setFailedQuestions([]);
              setLikedQuestions([]);
              setSavedQuestions([]);
              setComments({});
              setImageSeeds({});
              setRocketClicks({});
              setViewCounts({});
              setGameStarted(false);
              setGameOver(false);
              setGameMode(null);
              setSelectedOption(null);
              setFeedback(null);
            } catch (error) {
              console.error(error);
              alert("Hubo un problema al leer el archivo Excel.");
            } finally {
              setLoadingFile(false);
            }
          };
          reader.onerror = () => {
            alert("No se pudo leer el archivo.");
            setLoadingFile(false);
          };

          reader.readAsArrayBuffer(file);
          e.target.value = "";
        }


        function prepareOptionsForCurrentQuestion() {
          const current = questions[currentIndex];
          if (!current) return;

          const otherAnswers = questions
            .filter((_, idx) => idx !== currentIndex)
            .map((q) => q.answer)
            .filter((a) => a !== current.answer);

          // Shuffle distractors and pick up to 3
          const shuffledOthers = shuffleArray(otherAnswers);
          const numDistractors = Math.min(3, shuffledOthers.length);
          const distractors = shuffledOthers.slice(0, numDistractors).map((text) => ({
            text,
            isCorrect: false,
          }));

          const opts = shuffleArray([
            { text: current.answer, isCorrect: true },
            ...distractors,
          ]);

          setOptions(opts);
          setSelectedOption(null);
          setFeedback(null);
          setDisabledOptions([]);
        }

        function playSound(ref) {
          try {
            ref.current.currentTime = 0;
            ref.current.play();
          } catch (_) { }
        }

        function triggerConfetti() {
          if (typeof confetti !== "function") return;
          confetti({
            particleCount: 120,
            spread: 70,
            origin: { y: 0.6 },
          });
        }

        function handleOptionClick(option) {
          if (!options.length || selectedOption || disabledOptions.includes(option.text)) return;

          // Desbloquear celebration en el primer gesto del usuario
          if (!celebrationUnlocked.current) {
            celebrationUnlocked.current = true;
            sfxCelebration.current.play().then(() => {
              sfxCelebration.current.pause();
              sfxCelebration.current.currentTime = 0;
            }).catch(() => { });
          }

          setSelectedOption(option);

          const isCorrect = option.isCorrect;
          if (isCorrect) {
            setFeedback({ type: "correct", message: "¡Correcto!" });
            playSound(sfxCorrect);
            const pts = Math.round(100 / questions.length);
            setScore((s) => s + (disabledOptions.length === 0 ? pts : 0));
            if (disabledOptions.length === 0) setCorrectCount((c) => c + 1);
            triggerConfetti();
            if (timeoutRef.current) clearTimeout(timeoutRef.current);
            timeoutRef.current = setTimeout(() => {
              goToNextQuestion();
            }, 1600);
          } else {
            // Track failed question (only first wrong attempt per question)
            if (disabledOptions.length === 0) {
              const current = questions[currentIndex];
              setFailedQuestions((prev) => {
                const alreadyTracked = prev.some(
                  (q) => q.answer === current.answer && q.question === current.question
                );
                return alreadyTracked ? prev : [...prev, current];
              });
            }
            setFeedback({ type: "wrong", message: "Incorrecto. ¡Intenta de nuevo!" });
            playSound(sfxError);
            setWrongCount((c) => c + 1);
            if (timeoutRef.current) clearTimeout(timeoutRef.current);
            timeoutRef.current = setTimeout(() => {
              setDisabledOptions((prev) => [...prev, option.text]);
              setSelectedOption(null);
              setFeedback(null);
            }, 1600);
          }
        }

        function goToNextQuestion() {
          setRevealed(false);
          setShowComments(false);
          setCurrentComment("");
          setCurrentIndex((idx) => {
            if (idx + 1 >= questions.length) {
              setGameOver(true);
              return idx;
            }
            return idx + 1;
          });
          setSelectedOption(null);
          setFeedback(null);
        }

        function handleRestart() {
          if (!rawRows.length) {
            setGameStarted(false);
            setGameOver(false);
            setGameMode(null);
            return;
          }
          setShowRestartChoice(true);
        }

        function handleReviewFailed() {
          if (!failedQuestions.length) return;
          const shuffled = shuffleArray(failedQuestions);
          setQuestions(shuffled);
          setCurrentIndex(0);
          setScore(0);
          setCorrectCount(0);
          setWrongCount(0);
          setGameOver(false);
          setGameStarted(true);
          setSelectedOption(null);
          setFeedback(null);
          setFailedQuestions([]);
          setRevealed(false);
        }

        const startModule = (mode, forceReset = false, filterMode = 'all') => {
          if (mode !== 'module7' && mode !== 'module8' && rawRows.length === 0) {
            alert(`No hay preguntas cargadas en el cuestionario activo ("${activeQuiz}"). Entra al Módulo 7 para gestionarlo.`);
            return;
          }
          const oldGroup = getModuleGroup(prevMode);
          const newGroup = getModuleGroup(mode);

          if (mode === 'module7') {
            setQuestions([]);
          }

          const sessionKey = `cuestionario_session_${newGroup}_${activeQuiz}`;

          // 1. Guardar progreso del grupo anterior si cambiamos de grupo
          if (oldGroup && oldGroup !== newGroup) {
            const oldSessionKey = `cuestionario_session_${oldGroup}_${activeQuiz}`;
            const session = {
              questions,
              currentIndex,
              score,
              correctCount,
              wrongCount,
              failedQuestions,
              gameOver
            };
            localStorage.setItem(oldSessionKey, JSON.stringify(session));
          }

          // 2. Intentar restaurar progreso del nuevo grupo
          let restored = false;
          if (!forceReset && (oldGroup !== newGroup)) {
            const saved = localStorage.getItem(sessionKey);
            if (saved) {
              try {
                const session = JSON.parse(saved);
                if (session.questions && session.questions.length > 0) {
                  setQuestions(session.questions);
                  setCurrentIndex(session.currentIndex);
                  setScore(session.score || 0);
                  setCorrectCount(session.correctCount || 0);
                  setWrongCount(session.wrongCount || 0);
                  setFailedQuestions(session.failedQuestions || []);
                  setGameOver(session.gameOver || false);
                  restored = true;
                }
              } catch (e) { console.warn("Error restaurando sesión:", e); }
            }
          }

          // 3. Lógica normal si no se restauró nada (o es el mismo grupo)
          if (!restored) {
            const shouldContinueInGroup = !forceReset && oldGroup === newGroup && questions.length > 0 && !gameOver;

            if (!shouldContinueInGroup) {
              let actualFilter = filterMode;
              if (filterMode === false) actualFilter = 'pending';
              if (filterMode === true) actualFilter = 'all';

              let filteredRows = rawRows;
              if (actualFilter === 'pending') {
                filteredRows = rawRows.filter(row => !likedQuestions.includes(row.question + row.answer));
                if (filteredRows.length === 0) {
                  alert("¡Felicidades! No tienes preguntas pendientes. Repasaremos todas.");
                  filteredRows = rawRows;
                }
              } else if (actualFilter === 'knownOnly') {
                filteredRows = rawRows.filter(row => likedQuestions.includes(row.question + row.answer));
              }
              const shuffled = shuffleArray(filteredRows);
              setQuestions(shuffled);
              setCurrentIndex(0);
              audioRef.current.index = 0;
              setScore(0);
              setCorrectCount(0);
              setWrongCount(0);
              setFailedQuestions([]);
              setGameOver(false);
            }
          }

          setGameStarted(true);
          setGameMode(mode);
          setPrevMode(mode);
          setSelectedOption(null);
          setFeedback(null);
          setRevealed(false);
          setShowRestartChoice(false);
        };

        const getFormattedTime = (timeValue) => {
          if (!timeValue) return "";
          let dateObj;
          let originalTimeStr = "";

          if (typeof timeValue === 'number') {
            dateObj = new Date(timeValue);
            originalTimeStr = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          } else if (typeof timeValue === 'string') {
            let cleanStr = timeValue;
            if (timeValue.includes(', ')) cleanStr = timeValue.split(', ')[1];
            const parts = cleanStr.split(' a las ');
            const datePart = parts[0];
            originalTimeStr = parts[1] || "";
            const [d, m, y] = datePart.split('/').map(Number);
            dateObj = new Date(y, m - 1, d);
          }

          if (!dateObj || isNaN(dateObj.getTime())) return timeValue;

          const now = new Date();
          // Reset hours to compare only full days
          const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
          const commentDay = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
          const diffDays = (today - commentDay) / (1000 * 60 * 60 * 24);

          if (diffDays < 7) {
            const dayName = dateObj.toLocaleDateString('es-ES', { weekday: 'long' });
            return `${dayName}, ${dateObj.toLocaleDateString('es-ES')} a las ${originalTimeStr}`;
          } else {
            return `${dateObj.toLocaleDateString('es-ES')} a las ${originalTimeStr}`;
          }
        };

        const getModuleGroup = (m) => {
          if (!m) return null;
          if (m === 'quiz') return 'quiz';
          if (['module3', 'module4', 'module5', 'module6', 'module8'].includes(m)) return 'study';
          return null;
        };

        async function toggleFullscreen(enable) {
          const doc = document.documentElement;
          try {
            if (enable) {
              const request = doc.requestFullscreen || doc.webkitRequestFullscreen || doc.mozRequestFullScreen || doc.msRequestFullscreen;
              if (request) await request.call(doc);
            } else {
              const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
              if (isFs) {
                const exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
                if (exit) await exit.call(document);
              }
            }
          } catch (err) {
            console.warn("Fullscreen toggle error:", err);
          }
        }

        function handleChangeModule() {
          toggleFullscreen(false);
          setPrevMode(gameMode);
          setGameStarted(false);
          setGameOver(false);
          setGameMode(null);
          setSelectedOption(null);
          setFeedback(null);
          setRevealed(false);

        }

        function closeConfirm() {
          setConfirm(null);
        }


        const toggleKnown = (question) => {
          const key = question.question + question.answer;
          setLikedQuestions(prev => {
            const isLiked = prev.includes(key);
            const next = isLiked ? prev.filter(k => k !== key) : [...prev, key];

            toggleLike(question);

            ...prev,

          }));
          const question = questions[index];
          const key = question.question + question.answer;
          setRocketClicks(prev => ({

        const addComment = (question) => {

          const key = question.question + question.answer;
          const newComment = { text: currentComment.trim(), time: Date.now() };
          setComments(prev => {
            const nextComments = [...(prev[key] || []), newComment];

        const handleTouchStart = (e) => {
          touchStartX.current = e.targetTouches[0].clientX;
        };

        const handleTouchMove = (e) => {
          touchEndX.current = e.targetTouches[0].clientX;
        };

        const handleTouchEnd = () => {
          if (!touchStartX.current || !touchEndX.current) {
            isSwipeRef.current = false;
            return;
          }
          const distance = touchStartX.current - touchEndX.current;
          const minSwipeDistance = 50;
          if (Math.abs(distance) > minSwipeDistance) {
            isSwipeRef.current = true;
            if (distance > minSwipeDistance) {
              setRevealed(false);
              goToNextQuestion();

              if (currentIndex > 0) {

            isSwipeRef.current = false;

        const isDarkTheme = gameStarted && (gameMode === 'module4' || gameMode === 'module5' || (gameMode === 'module3' && lightMode === 0));

                    <div className="m5-star-layer m5-stars-2"></div>
                    <div className="m5-star-layer m5-stars-3"></div>
                  </div>

                  {!gameOver ? (
                    <>
                      <div className="m5-top-layout">
                        <div className="m5-progress-text">
                          {currentIndex + 1} / {totalQuestions}
                        </div>
                        <button
                          className="m5-close-btn"
                          onClick={(e) => { e.stopPropagation(); handleChangeModule(); }}
                          title="Salir"
                        >
                          <span className="m5-close-text">Salir</span> ⛌
                        </button>
                      </div>

                      <div className={`m5-comet ${cometDir !== null ? `m5-comet-dir-${cometDir}` : ''}`} />
                      <div className={`m5-galaxy ${galaxyDir !== null ? `m5-galaxy-dir-${galaxyDir}` : ''}`} />
                      <div className={`m5-saturn ${saturnDir !== null ? `m5-saturn-dir-${saturnDir}` : ''}`} />
                      <div className={`m5-moon ${moonDir !== null ? `m5-moon-dir-${moonDir}` : ''}`} />
                      <div className={`m5-jupiter ${jupiterDir !== null ? `m5-jupiter-dir-${jupiterDir}` : ''}`} />
                      <div className={`m5-mars ${marsDir !== null ? `m5-mars-dir-${marsDir}` : ''}`} />

                      <div className="m5-content">
                        {!revealed ? (
                          <div className="m5-question m5-fade-in">{currentQuestion?.question}</div>
                        ) : (
                          <div className="m5-answer m5-fade-in">{currentQuestion?.answer}</div>
                        )}
                      </div>
                    </>
                  ) : (
                    renderResults("results-m5")
                  )}
                </main>
              )}

              {gameStarted && gameMode === 'module6' && (
                <main
                  className={`module6-area ${showComments ? 'm6-scroll-active' : ''}`}
                  onTouchStart={handleTouchStart}
                  onTouchMove={handleTouchMove}
                  onTouchEnd={handleTouchEnd}
                >
                  {!gameOver ? (
                    <div className="m6-card" key={currentIndex}>
                      <div className="m6-header">
                        {showMusicReminder ? (
                          <div className="m6-music-reminder">
                            🎧 Ponte audífonos y escucha buena música
                          </div>
                        ) : (
                          <>
                            <div className="m6-user-info-group">
                              <div className="m6-avatar">Q</div>
                              <div className="m6-user-texts">
                                <span className="m6-location">Pregunta {currentIndex + 1} de {totalQuestions}</span>
                              </div>
                            </div>
                            <div className="m6-header-actions">
                              <button className="m6-restart-btn" title="Reiniciar cuestionario" onClick={(e) => { e.stopPropagation(); handleRestart(); }}>🔄</button>
                              <button className="m6-close-x" onClick={handleChangeModule}>⛌</button>
                            </div>
                          </>
                        )}
                      </div>

                      <div
                        className="m6-image-container"
                        onClick={() => {
                          if (!revealed) {
                            const key = currentQuestion.question + currentQuestion.answer;
                            setViewCounts(prev => {
                              const nextVal = (prev[key] || 0) + 1;
                              syncToTurso(key, 'views', nextVal);
                              return { ...prev, [key]: nextVal };
                            });
                          }
                          setRevealed(!revealed);
                        }}
                      >
                        <img
                          src={`https://picsum.photos/${window.innerWidth > 500 ? '1080' : '1080'}/${window.innerWidth > 500 ? '1080' : '1350'}?random=${imageSeeds[currentIndex] || currentIndex}`}
                          alt="Instagram style"
                          className="m6-main-image"
                          key={`img-${currentIndex}-${imageSeeds[currentIndex] || ''}`}
                          loading="lazy"
                        />
                        {showBigHeart && (
                          <div className="m6-heart-animation">❤️</div>
                        )}

                        <div className={`m6-image-answer-overlay ${revealed ? 'm6-visible' : ''}`}>
                          <div className="m6-overlay-answer-box">
                            {currentQuestion?.answer}
                          </div>
                        </div>
                      </div>

                      <div className="m6-content-section">
                        <div className="m6-interactions">
                          <div className="m6-interaction-group">
                            <span
                              className={`m6-icon ${likedQuestions.includes(currentQuestion?.question + currentQuestion?.answer) ? 'm6-liked' : ''}`}
                              onClick={(e) => { e.stopPropagation(); toggleKnown(currentQuestion); }}
                              title={likedQuestions.includes(currentQuestion?.question + currentQuestion?.answer) ? "Ya me la sé" : "Marcar como conocida"}
                            >
                              {likedQuestions.includes(currentQuestion?.question + currentQuestion?.answer) ? '❤️' : '🤍'}
                            </span>
                          </div>

                          <div className="m6-interaction-group">
                            <span className="m6-icon" onClick={(e) => { e.stopPropagation(); setShowComments(!showComments); }}>
                              {showComments ? '💬' : '🗨️'}
                            </span>
                            <span className="m6-counter">{(comments[currentQuestion?.question + currentQuestion?.answer] || []).length}</span>
                          </div>

                          <div className="m6-interaction-group">
                            <span className="m6-icon" style={{ cursor: 'default' }}>👁️</span>
                            <span className="m6-counter">{viewCounts[currentQuestion?.question + currentQuestion?.answer] || 0}</span>
                          </div>
                        </div>

                        <div className="m6-text-content">
                          <p className="m6-question-text">
                            <span className="m6-username-inline">Pregunta:</span> {currentQuestion?.question}
                          </p>
                        </div>

                        <div className="m6-footer">
                          <button
                            className="m6-nav-btn"
                            onClick={() => { setRevealed(false); setCurrentIndex(prev => Math.max(0, prev - 1)); }}
                            disabled={currentIndex === 0}
                          >
                            Anterior
                          </button>
                          <button
                            className="m6-nav-btn m6-next-btn"
                            onClick={() => { setRevealed(false); goToNextQuestion(); }}
                          >
                            {currentIndex + 1 < totalQuestions ? 'Siguiente' : 'Finalizar'}
                          </button>
                        </div>

                        {showComments && (
                          <div className="m6-comments-container m6-fade-in">
                            <div className="m6-comments-list">
                              {(comments[currentQuestion?.question + currentQuestion?.answer] || []).map((c, i) => (
                                <div key={i} className="m6-comment">
                                  <div className="m6-comment-top">
                                    <span className="m6-username-inline">josued.sanchez</span>
                                    <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                                      <span className="m6-comment-time">{typeof c === 'string' ? '' : getFormattedTime(c.time)}</span>
                                      <button onClick={(e) => { e.stopPropagation(); deleteComment(currentQuestion, i); }} style={{ background: 'transparent', border: 'none', color: '#ef4444', cursor: 'pointer', padding: 0, fontSize: '0.8rem' }} title="Eliminar comentario">✖</button>
                                    </div>
                                  </div>
                                  <div className="m6-comment-text">{typeof c === 'string' ? c : c.text}</div>
                                </div>
                              ))}
                              {!(comments[currentQuestion?.question + currentQuestion?.answer] || []).length && (
                                <p className="m6-no-comments">No hay comentarios aún.</p>
                              )}
                            </div>
                            <div className="m6-add-comment">
                              <input
                                type="text"
                                placeholder="Añade un comentario..."
                                value={currentComment}
                                onChange={(e) => setCurrentComment(e.target.value)}
                                onKeyDown={(e) => e.key === 'Enter' && addComment(currentQuestion)}
                              />
                              <button
                                onClick={() => addComment(currentQuestion)}
                                disabled={!currentComment.trim()}
                              >
                                Publicar
                              </button>
                            </div>
                          </div>
                        )}
                      </div>
                    </div>
                  ) : (
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', width: '100%', minHeight: '100vh', padding: '20px' }}>
                      {renderResults("results-m6")}
                    </div>
                  )}
                </main>
              )}


              {gameStarted && gameMode === 'quiz' && (
                <main className="game-area">
                  {!gameOver ? (
                    <>
                      <div className="question-card question-enter">
                        <div className="question-label">Pregunta</div>
                        <div className="question-text">{currentQuestion?.question}</div>
                      </div>

                      <div className="options-container">
                        {options.map((opt, idx) => {
                          const isSelected =
                            selectedOption && selectedOption.text === opt.text;
                          const isEliminated = disabledOptions.includes(opt.text);
                          const labels = ["A", "B", "C", "D"];

                          let className = "option-button";
                          if (isEliminated) {
                            className += " option-eliminated";
                          } else if (isSelected && feedback?.type === "correct") {
                            className += " option-correct option-pulse";
                          } else if (isSelected && feedback?.type === "wrong") {
                            className += " option-wrong option-shake";
                          }

                          return (
                            <button
                              key={idx}
                              className={className}
                              onClick={() => handleOptionClick(opt)}
                              disabled={!!selectedOption || isEliminated}
                            >
                              <span className="option-label">{labels[idx]}</span>
                              {opt.text}
                            </button>
                          );
                        })}
                      </div>

                      {feedback && (
                        <div
                          className={
                            feedback.type === "correct"
                              ? "feedback feedback-correct"
                              : "feedback feedback-wrong"
                          }
                        >
                          {feedback.message}
                        </div>
                      )}
                    </>
                  ) : (
                    renderResults("results-quiz")
                  )}
                </main>
              )}

              {
                gameStarted && !gameOver && gameMode === 'quiz' && (
                  <div className="stats">
                    <div className="stat-item">
                      <span className="stat-label">Puntaje</span>
                      <span className="stat-value">{score}</span>
                    </div>
                    <div className="stat-item">
                      <span className="stat-label">Aciertos</span>
                      <span className="stat-value stat-ok">{correctCount}</span>
                    </div>
                    <div className="stat-item">
                      <span className="stat-label">Errores</span>
                      <span className="stat-value stat-bad">{wrongCount}</span>
                    </div>
                  </div>
                )
              }


              {
                confirm && (
                  <div className="confirm-overlay">
                    <div className="confirm-card">
                      <p className="confirm-message">{confirm.message}</p>
                      <div className="confirm-actions">
                        <button className="confirm-cancel" onClick={closeConfirm}>Cancelar</button>
                        <button className="confirm-accept" onClick={() => { confirm.onAccept(); closeConfirm(); }}>Aceptar</button>
                      </div>
                    </div>
                  </div>
                )
              }

              {/* La sección de results-card ha sido movida dentro de cada módulo */}

              {
                gameStarted && !gameOver && gameMode === 'quiz' && (
                  <div className="bottom-actions">
                    <button className="ghost-button" onClick={handleRestart}>
                      Reiniciar ronda
                    </button>
                  </div>
                )
              }

              <footer className="app-footer" style={{ display: (gameMode === 'module3' || gameMode === 'module4' || gameMode === 'module5' || gameMode === 'module6') ? 'none' : '' }}>
                <span>
                  Carga tu Excel y convierte el estudio en un juego interactivo.
                </span>
              </footer>

              {
                showRestartChoice && (
                  <div className="m6-restart-overlay m6-fade-in">
                    <div className="m6-restart-modal">
                      <h3>Modo de Repaso</h3>
                      <p>¿Qué preguntas deseas incluir?</p>
                      <div className="m6-restart-options">
                        <button
                          className="m6-choice-btn m6-primary"
                          onClick={() => startModule(gameMode, true, 'pending')}
                        >
                          🎯 Solo pendientes
                          <small>({rawRows.length - likedQuestions.length} restantes)</small>
                        </button>
                        <button
                          className="m6-choice-btn m6-success"
                          onClick={() => startModule(gameMode, true, 'knownOnly')}
                          disabled={likedQuestions.length === 0}
                        >
                          ❤️ Solo conocidas
                          <small>({likedQuestions.length} preguntas)</small>
                        </button>
                        <button
                          className="m6-choice-btn m6-secondary"
                          onClick={() => startModule(gameMode, true, 'all')}
                        >
                          🔄 Repasar todo
                          <small>({rawRows.length} preguntas)</small>
                        </button>
                        <button
                          className="m6-choice-btn m6-cancel"
                          onClick={() => setShowRestartChoice(false)}
                        >
                          Cancelar
                        </button>
                      </div>
                    </div>
                  </div>
                )
              }

              
              {/* Elemento de Audio Fantasma para mantener vivo el sistema en móviles (Samsung/Xiaomi) */}
              <audio id="silent-keep-alive" loop src={silentWav} style={{ display: 'none' }} />
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    }
  </script>
</body>

</html>
